<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Adivo Ads · Cocos iOS Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0f141f; color: #fff; }
    body { display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
    main { width: min(100%, 520px); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 0 16px; color: #b8c0cc; }
    video { display: block; width: 100%; max-height: calc(100vh - 120px); border-radius: 12px; background: #000; }
  </style>
</head>
<body>
  <main>
    <h1>Adivo Ads · Cocos iOS Demo</h1>
    <p>初始化、加载、展示、奖励与关闭回调演示</p>
    <video controls playsinline preload="metadata" poster="demo-cover.jpg">
      <source src="demo.mp4" type="video/mp4">
      当前浏览器不支持 MP4 播放。
    </video>
  </main>
</body>
</html>
